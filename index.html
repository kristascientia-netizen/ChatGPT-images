<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mini App</title>
  <script src="https://telegram.org"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow-x: hidden;
    }
    #desktop-container {
      width: 1088px;
      transform-origin: top left;
    }
    iframe {
      width: 1088px !important;
      min-height: 720px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="desktop-container">
    <iframe src="https://lumi.education" width="1088" height="720" frameborder="0" allowfullscreen="allowfullscreen" allow="geolocation *; microphone *; camera *; midi *; encrypted-media *"></iframe>
    <script src="https://lumi.education" charset="UTF-8"></script>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.requestFullscreen) {
      tg.requestFullscreen();
    }

    function scaleToDesktop() {
      const container = document.getElementById('desktop-container');
      const screenWidth = window.innerWidth;
      const scale = screenWidth / 1088;
      container.style.transform = `scale(${scale})`;
      container.style.height = `${720 * scale}px`;
    }

    scaleToDesktop();
    window.addEventListener('resize', scaleToDesktop);
  </script>
</body>
</html>
