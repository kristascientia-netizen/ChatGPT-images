<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mini App</title>
  <script src="https://telegram.org"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow-x: hidden;
    }
    #desktop-container {
      width: 1088px;
      transform-origin: top left;
    }
  </style>
</head>
<body>

  <div id="desktop-container">
    <iframe src="https://app.lumi.education/api/v1/run/XtsPwC/embed" width="1088" height="720" frameborder="0" allowfullscreen="allowfullscreen" allow="geolocation *; microphone *; camera *; midi *; encrypted-media *"></iframe><script src="https://app.Lumi.education/api/v1/h5p/core/js/h5p-resizer.js" charset="UTF-8"></script>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.requestFullscreen) {
      tg.requestFullscreen();
    }

    function scaleToDesktop() {
      const container = document.getElementById('desktop-container');
      const scale = window.innerWidth / 1088;
      container.style.transform = `scale(${scale})`;
    }

    scaleToDesktop();
    window.addEventListener('resize', scaleToDesktop);
  </script>
</body>
</html>
