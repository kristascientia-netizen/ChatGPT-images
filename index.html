<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Mini App</title>
  <script src="https://telegram.org"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow-x: hidden;
    }
    #desktop-container {
      width: 1088px;
    }
  </style>
</head>
<body>

  <div id="desktop-container">
    <iframe src="https://lumi.education" width="1088" height="720" frameborder="0" allowfullscreen="allowfullscreen" allow="geolocation *; microphone *; camera *; midi *; encrypted-media *"></iframe><script src="https://lumi.education" charset="UTF-8"></script>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    if (tg.requestFullscreen) {
      tg.requestFullscreen();
    }

    function fitDesktopView() {
      const container = document.getElementById('desktop-container');
      const realScreenWidth = document.documentElement.clientWidth || window.innerWidth;
      const scale = realScreenWidth / 1088;
      container.style.zoom = scale;
    }

    fitDesktopView();
    window.addEventListener('resize', fitDesktopView);
    setTimeout(fitDesktopView, 300);
    setTimeout(fitDesktopView, 1000);
  </script>
</body>
</html>
